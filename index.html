<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MineCraft Tap-to-Earn</title>
    <!-- Pixel Font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background: linear-gradient(135deg, #2b2b2b 0%, #111111 100%);
            border: 4px solid #444;
        }
        /* Top Header */
        .header {
            text-align: center;
            width: 100%;
        }
        .score-board {
            font-size: 24px;
            color: #55ff55;
            text-shadow: 2px 2px #000;
            margin-top: 10px;
        }
        .score-board span {
            font-size: 32px;
            color: #ffaa00;
        }
        /* Mining Area */
        .mine-area {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        /* Pixel Diamond Ore Block */
        .ore-block {
            width: 180px;
            height: 180px;
            background: #333333;
            border: 6px solid #111;
            box-shadow: inset 0 0 0 6px #555, 0 8px 0 #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.05s ease;
            position: relative;
            image-rendering: pixelated;
        }
        .ore-block:active {
            transform: scale(0.95);
            box-shadow: inset 0 0 0 6px #555, 0 3px 0 #000;
        }
        /* Minecraft Diamond Texture Simulation */
        .inner-ore {
            width: 120px;
            height: 120px;
            background-color: #4f4f4f;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 4px;
            padding: 6px;
            border: 3px solid #222;
        }
        .pixel-gem {
            background-color: #55ffff;
            box-shadow: inset 2px 2px #9fffffff, inset -2px -2px #00aaaa;
        }
        .pixel-stone {
            background-color: #616161;
        }
        
        /* Floating +1 Animation */
        .floating-text {
            position: absolute;
            font-size: 20px;
            color: #55ff55;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.2);
            }
        }

        /* Energy / Stamina Bar Section */
        .footer-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #aaa;
        }
        .energy-bar-container {
            width: 100%;
            height: 20px;
            background: #111;
            border: 3px solid #444;
            padding: 2px;
        }
        .energy-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff5555, #ffaa00, #55ff55);
            transition: width 0.2s linear;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div style="font-size: 12px; color: #aaa;">MINECRAFT TAP</div>
            <div class="score-board">💎 <span id="score">0</span></div>
        </div>

        <!-- Mining Block -->
        <div class="mine-area" id="mineArea">
            <div class="ore-block" id="oreBlock">
                <div class="inner-ore">
                    <div class="pixel-stone"></div><div class="pixel-gem"></div><div class="pixel-stone"></div><div class="pixel-stone"></div>
                    <div class="pixel-gem"></div><div class="pixel-stone"></div><div class="pixel-gem"></div><div class="pixel-stone"></div>
                    <div class="pixel-stone"></div><div class="pixel-gem"></div><div class="pixel-stone"></div><div class="pixel-gem"></div>
                    <div class="pixel-stone"></div><div class="pixel-stone"></div><div class="pixel-gem"></div><div class="pixel-stone"></div>
                </div>
            </div>
        </div>

        <!-- Footer / Energy Bar -->
        <div class="footer-section">
            <div class="energy-info">
                <span>⚡ ENERGY</span>
                <span id="energyText">1000 / 1000</span>
            </div>
            <div class="energy-bar-container">
                <div class="energy-bar" id="energyBar"></div>
            </div>
        </div>
    </div>

    <script>
        let score = 0;
        let energy = 1000;
        const maxEnergy = 1000;

        const scoreEl = document.getElementById('score');
        const oreBlock = document.getElementById('oreBlock');
        const mineArea = document.getElementById('mineArea');
        const energyBar = document.getElementById('energyBar');
        const energyText = document.getElementById('energyText');

        // Tap Event
        oreBlock.addEventListener('click', (e) => {
            if (energy > 0) {
                score += 1;
                energy -= 1;
                
                scoreEl.innerText = score;
                updateEnergyUI();

                // Create Floating +1 Text at Click Position
                const rect = mineArea.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const floatText = document.createElement('div');
                floatText.className = 'floating-text';
                floatText.innerText = '+1';
                floatText.style.left = `${x - 10}px`;
                floatText.style.top = `${y - 20}px`;

                mineArea.appendChild(floatText);

                setTimeout(() => {
                    floatText.remove();
                }, 600);
            }
        });

        // Energy Recovery System (Har second energy thodi recharge hogi)
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 3);
                updateEnergyUI();
            }
        }, 1000);

        function updateEnergyUI() {
            energyText.innerText = `${energy} / ${maxEnergy}`;
            const percentage = (energy / maxEnergy) * 100;
            energyBar.style.width = `${percentage}%`;
        }
    </script>
</body>
</html>
