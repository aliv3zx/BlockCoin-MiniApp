<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tap2Mine - Retro Edition</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #12121c;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      image-rendering: pixelated;
    }

    /* Screen Management */
    .screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }

    .screen.active {
      display: flex;
    }

    /* 1. START SCREEN STYLING */
    #start-screen {
      background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=600&auto=format&fit=crop') center/cover;
      justify-content: center;
      gap: 40px;
    }

    .pixel-title {
      font-size: 22px;
      color: #ffd700;
      text-shadow: 3px 3px #000;
      text-align: center;
    }

    .start-btn {
      background: #4caf50;
      color: #fff;
      border: 4px solid #2e7d32;
      padding: 16px 32px;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      box-shadow: inset 4px 4px #81c784, inset -4px -4px #1b5e20, 0 6px 0 #000;
      cursor: pointer;
      transition: transform 0.05s ease;
    }

    .start-btn:active {
      transform: translateY(4px);
      box-shadow: inset 4px 4px #1b5e20, inset -4px -4px #81c784, 0 2px 0 #000;
    }

    /* 2. MAIN GAME SCREEN STYLING */
    #game-screen {
      background: linear-gradient(to bottom, #3b82f6, #10b981);
      justify-content: space-between;
    }

    /* Top Bar */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
    }

    .top-left, .top-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .badge {
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 10px;
      border-radius: 6px;
      border: 2px solid rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 8px;
    }

    .icon-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(255,255,255,0.3);
      padding: 6px 8px;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 10px;
    }

    /* Center Mine Area (Mystery Box) */
    .center-mining-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
    }

    .mystery-box {
      width: 150px;
      height: 150px;
      background: #facc15;
      border: 6px solid #ca8a04;
      box-shadow: inset 8px 8px #fde047, inset -8px -8px #a16207, 0 10px 0 #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      color: #713f12;
      text-shadow: 3px 3px #fde047;
      cursor: pointer;
      transition: transform 0.05s ease;
      position: relative;
    }

    .mystery-box:active {
      transform: scale(0.93);
    }

    /* Bottom Action Bar */
    .bottom-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pixel-action-btn {
      background: #8b5a2b;
      color: #fff;
      border: 3px solid #4a2f13;
      padding: 10px 14px;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      border-radius: 6px;
      box-shadow: 0 4px 0 #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .pixel-action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #000;
    }

    /* Floating Text Animation */
    .popup-text {
      position: absolute;
      color: #fff700;
      font-size: 14px;
      animation: floatUp 0.6s ease-out forwards;
      pointer-events: none;
      text-shadow: 2px 2px #000;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-50px); }
    }
  </style>
</head>
<body>

  <!-- START SCREEN -->
  <div id="start-screen" class="screen active">
    <div class="pixel-title">Tap2Mine</div>
    <button class="start-btn" onclick="startGame()">START</button>
    <div style="font-size: 7px; opacity: 0.8; text-shadow: 1px 1px #000;">BlockCoin v1.0</div>
  </div>

  <!-- MAIN GAME SCREEN -->
  <div id="game-screen" class="screen">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="top-left">
        <button class="icon-btn" onclick="alert('Settings opened')">⚙️</button>
        <button class="icon-btn" onclick="alert('Watch AD for bonus energy!')">🎬 AD</button>
      </div>
      <div class="top-right">
        <div class="badge">⚡ <span id="energy-count">100</span>/100</div>
        <div class="badge">🪙 <span id="coin-count">1000</span></div>
      </div>
    </div>

    <!-- Center Mystery Block -->
    <div class="center-mining-area">
      <div class="mystery-box" id="mine-box">
        ?
      </div>
    </div>

    <!-- Bottom Bar (Shop & Withdraw) -->
    <div class="bottom-bar">
      <button class="pixel-action-btn" onclick="openShop()">
        🛒 Shop
      </button>
      <button class="pixel-action-btn" style="background: #b91c1c; border-color: #7f1d1d;" onclick="openWithdraw()">
        💰 Withdraw
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let coins = 1000;
    let energy = 100;
    const maxEnergy = 100;

    const coinText = document.getElementById('coin-count');
    const energyText = document.getElementById('energy-count');
    const mineBox = document.getElementById('mine-box');

    function startGame() {
      document.getElementById('start-screen').classList.remove('active');
      document.getElementById('game-screen').classList.add('active');
    }

    // Mining Click Logic
    mineBox.addEventListener('pointerdown', (e) => {
      if (energy <= 0) {
        alert('Energy khatam ho gayi! Thodi der wait karein.');
        return;
      }

      coins += 1;
      energy -= 1;
      updateUI();

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }

      showFloatingText(e.clientX, e.clientY, "+1");
    });

    function updateUI() {
      coinText.innerText = coins;
      energyText.innerText = energy;
    }

    function showFloatingText(x, y, text) {
      const el = document.createElement('div');
      el.className = 'popup-text';
      el.innerText = text;
      el.style.left = `${x - 10}px`;
      el.style.top = `${y - 25}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 600);
    }

    // Energy Recovery over time
    setInterval(() => {
      if (energy < maxEnergy) {
        energy = Math.min(maxEnergy, energy + 1);
        updateUI();
      }
    }, 1500);

    function openShop() {
      alert('Upgrades Shop: Yahan se aap items kharid sakenge!');
    }

    function openWithdraw() {
      alert('Withdraw system jaldi aayega!');
    }
  </script>
</body>
</html>
