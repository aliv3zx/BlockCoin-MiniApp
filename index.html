<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap2Mine - Telegram Earning Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            /* Minecraft village/nature pixel vibe background color */
            background: linear-gradient(180deg, #38761d 0%, #274e13 40%, #111111 100%);
            border: 4px solid #444;
            position: relative;
        }
        
        /* Top Bar: Settings, AD, Energy, Coins */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
        }
        .top-stats {
            display: flex;
            gap: 10px;
        }
        .stat-box {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #555;
            padding: 5px 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            border-radius: 4px;
        }

        /* Central Tap Area */
        .mine-area {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        /* Tap2Mine Question/Gold Block */
        .ore-block {
            width: 200px;
            height: 200px;
            background: #f1c232;
            border: 6px solid #7f6000;
            box-shadow: inset 0 0 0 8px #ffd966, 0 10px 0 #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.05s ease;
            position: relative;
        }
        .ore-block:active {
            transform: scale(0.93);
            box-shadow: inset 0 0 0 8px #ffd966, 0 4px 0 #000;
        }
        .block-question {
            font-size: 70px;
            color: #fff;
            text-shadow: 4px 4px #7f6000;
            margin-bottom: -5px;
        }
        .block-title {
            font-size: 14px;
            color: #fff;
            background: rgba(0,0,0,0.4);
            padding: 4px 8px;
            border-radius: 4px;
            text-shadow: 2px 2px #000;
        }

        /* Floating +Coins Animation */
        .floating-text {
            position: absolute;
            font-size: 22px;
            color: #55ff55;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
        }

        /* Bottom Menu & Energy */
        .bottom-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #ffeb3b;
            text-shadow: 1px 1px #000;
        }
        .energy-bar-container {
            width: 100%;
            height: 16px;
            background: #111;
            border: 2px solid #555;
            padding: 2px;
            border-radius: 4px;
        }
        .energy-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff5555, #ffaa00, #55ff55);
            transition: width 0.2s linear;
        }

        /* Shop and Withdraw Buttons Row */
        .menu-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .pixel-btn {
            flex: 1;
            background: #c27ba0;
            border: 3px solid #741b47;
            color: white;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            padding: 12px 0;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #4a142e;
            border-radius: 4px;
        }
        .pixel-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #4a142e;
        }
        .pixel-btn.withdraw {
            background: #e69138;
            border: 3px solid #783f04;
            box-shadow: 0 4px 0 #431c01;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Navigation / Stats Bar -->
        <div class="top-bar">
            <div class="stat-box" style="font-size: 14px;">⚙️</div>
            <div class="top-stats">
                <div class="stat-box">⚡ <span id="energyVal">1000</span></div>
                <div class="stat-box">🪙 <span id="score">0</span></div>
            </div>
        </div>

        <!-- Central Tap2Mine Block -->
        <div class="mine-area" id="mineArea">
            <div class="ore-block" id="oreBlock">
                <div class="block-question">?</div>
                <div class="block-title">Tap2Mine</div>
            </div>
        </div>

        <!-- Bottom Section: Energy & Menu Buttons -->
        <div class="bottom-section">
            <div class="energy-info">
                <span>⚡ ENERGY</span>
                <span id="energyText">1000 / 1000</span>
            </div>
            <div class="energy-bar-container">
                <div class="energy-bar" id="energyBar"></div>
            </div>

            <div class="menu-row">
                <button class="pixel-btn" onclick="openShop()">🛒 SHOP</button>
                <button class="pixel-btn withdraw" onclick="openWithdraw()">💰 WITHDRAW</button>
            </div>
        </div>
    </div>

    <script>
        // LocalStorage se score load karna taaki refresh hone par 0 na ho
        let score = localStorage.getItem('blockcoin_score') ? parseInt(localStorage.getItem('blockcoin_score')) : 0;
        let energy = 1000;
        const maxEnergy = 1000;
        let tapPower = 1; // Har tap par kitne coins milenge

        const scoreEl = document.getElementById('score');
        const oreBlock = document.getElementById('oreBlock');
        const mineArea = document.getElementById('mineArea');
        const energyBar = document.getElementById('energyBar');
        const energyText = document.getElementById('energyText');
        const energyVal = document.getElementById('energyVal');

        scoreEl.innerText = score;

        // Tap Event
        oreBlock.addEventListener('click', (e) => {
            if (energy >= tapPower) {
                score += tapPower;
                energy -= tapPower;
                
                scoreEl.innerText = score;
                energyVal.innerText = energy;
                updateEnergyUI();

                // Save score permanently
                localStorage.setItem('blockcoin_score', score);

                // Floating +Coins text animation
                const rect = mineArea.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const floatText = document.createElement('div');
                floatText.className = 'floating-text';
                floatText.innerText = `+${tapPower}`;
                floatText.style.left = `${x - 10}px`;
                floatText.style.top = `${y - 20}px`;

                mineArea.appendChild(floatText);

                setTimeout(() => {
                    floatText.remove();
                }, 600);
            }
        });

        // Energy Recovery System
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 3);
                energyVal.innerText = energy;
                updateEnergyUI();
            }
        }, 1000);

        function updateEnergyUI() {
            energyText.innerText = `${energy} / ${maxEnergy}`;
            const percentage = (energy / maxEnergy) * 100;
            energyBar.style.width = `${percentage}%`;
        }

        function openShop() {
            alert("🛒 Shop Menu: Yahan jaldi hi Upgrades add honge!");
        }

        function openWithdraw() {
            alert(`💰 Total Balance: ${score} Coins\nWithdraw feature coming soon on TON Blockchain! 🚀`);
        }
    </script>
</body>
</html>
