<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tap2Mine</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #1a1a24;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      image-rendering: pixelated;
    }

    .header {
      text-align: center;
      margin-top: 10px;
    }

    .score-container {
      font-size: 20px;
      color: #55ff55;
      margin-top: 10px;
      text-shadow: 2px 2px #000;
    }

    .mine-container {
      position: relative;
      cursor: pointer;
    }

    .pixel-block {
      width: 160px;
      height: 160px;
      background: #8b5a2b;
      border: 8px solid #4a2f13;
      box-shadow: inset 8px 8px #a76d35, inset -8px -8px #331e08, 0 10px 0 #000;
      position: relative;
      transition: transform 0.05s ease;
    }

    .pixel-block::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 40px;
      background: #4ca634;
      box-shadow: inset 4px 4px #6bd64d, inset -4px -4px #2f6920;
    }

    .pixel-block:active {
      transform: scale(0.95);
    }

    .popup-text {
      position: absolute;
      color: #ffd700;
      font-size: 16px;
      animation: floatUp 0.6s ease-out forwards;
      pointer-events: none;
      text-shadow: 2px 2px #000;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-60px); }
    }

    .energy-container {
      width: 100%;
      max-width: 320px;
      margin-bottom: 20px;
      text-align: center;
    }

    .energy-bar-bg {
      background: #222;
      border: 4px solid #fff;
      height: 24px;
      margin-top: 8px;
      position: relative;
    }

    .energy-fill {
      background: #ffaa00;
      height: 100%;
      width: 100%;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <div class="header">
    <div id="username" style="font-size: 10px; color: #aaa;">Miner</div>
    <div class="score-container">
      💎 <span id="ore-count">0</span>
    </div>
  </div>

  <div class="mine-container" id="mine-btn">
    <div class="pixel-block" id="block"></div>
  </div>

  <div class="energy-container">
    <div style="font-size: 10px;">⚡ <span id="energy-text">100 / 100</span></div>
    <div class="energy-bar-bg">
      <div class="energy-fill" id="energy-fill"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe?.user) {
        document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
      }
    }

    let ores = 0;
    let energy = 100;
    const maxEnergy = 100;

    const oreText = document.getElementById('ore-count');
    const energyText = document.getElementById('energy-text');
    const energyFill = document.getElementById('energy-fill');
    const mineBtn = document.getElementById('mine-btn');

    mineBtn.addEventListener('pointerdown', (e) => {
      if (energy <= 0) return;

      ores += 1;
      energy -= 1;
      updateUI();

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }

      showFloatingText(e.clientX, e.clientY, "+1");
    });

    function updateUI() {
      oreText.innerText = ores;
      energyText.innerText = `${energy} / ${maxEnergy}`;
      energyFill.style.width = `${(energy / maxEnergy) * 100}%`;
    }

    function showFloatingText(x, y, text) {
      const el = document.createElement('div');
      el.className = 'popup-text';
      el.innerText = text;
      el.style.left = `${x - 15}px`;
      el.style.top = `${y - 30}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 600);
    }

    setInterval(() => {
      if (energy < maxEnergy) {
        energy = Math.min(maxEnergy, energy + 1);
        updateUI();
      }
    }, 1500);
  </script>
</body>
</html>
